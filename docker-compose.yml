services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://assignment:local_dev_only@db:5432/assignment?schema=public
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: assignment
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: assignment
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assignment -d assignment"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
